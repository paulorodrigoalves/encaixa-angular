<main class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-6xl mx-auto space-y-8">
    <header class="text-center">
      <h1 class="text-4xl font-bold text-slate-800">Encaixa - Layout Engine</h1>
      <p class="text-slate-500 mt-2">Angular 19 integrado com Spring Boot</p>
    </header>

    @if (!catalogo) {
      <div class="flex justify-center items-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-slate-800"></div>
        <span class="ml-4 text-slate-500 text-lg">Carregando catálogo do servidor...</span>
      </div>
    } @else {
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 grid grid-cols-1 md:grid-cols-4 gap-8">
        
        <!-- Painel Esquerdo: Formulário Reativo -->
        <div class="col-span-1 space-y-6">
          <form [formGroup]="form" class="space-y-5">
            <div>
              <h2 class="text-xl font-semibold text-slate-700 border-b pb-2">Gaveta</h2>
              <div class="mt-4 space-y-4">
                
                <div class="flex flex-col gap-1">
                  <label class="text-sm font-medium text-slate-600">Largura (mm)</label>
                  <input type="number" formControlName="larguraMm"
                         class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500" />
                </div>

                <div class="flex flex-col gap-1">
                  <label class="text-sm font-medium text-slate-600">Profundidade (mm)</label>
                  <input type="number" formControlName="profundidadeMm"
                         class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500" />
                </div>

                <div class="flex flex-col gap-1">
                  <label class="text-sm font-medium text-slate-600">Altura (mm)</label>
                  <input type="number" formControlName="alturaMm"
                         class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500" />
                </div>
              </div>
            </div>

            <div>
              <h2 class="text-xl font-semibold text-slate-700 border-b pb-2">Configuração</h2>
              <div class="mt-4 space-y-4">
                
                <div class="flex flex-col gap-1">
                  <label class="text-sm font-medium text-slate-600">Material</label>
                  <select formControlName="materialId"
                          class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 bg-white">
                    <option value="" disabled>Selecione o material...</option>
                    @for (m of catalogo.materiais; track m.id) {
                      <option [value]="m.id">{{ m.nome }} ({{ m.espessuraMm }}mm)</option>
                    }
                  </select>
                </div>

                <div class="flex flex-col gap-1">
                  <label class="text-sm font-medium text-slate-600">Template</label>
                  <select formControlName="templateId"
                          class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 bg-white">
                    <option value="" disabled>Selecione um template...</option>
                    @for (t of catalogo.templates; track t.id) {
                      <option [value]="t.id">{{ t.nome }} ({{ t.categoria }})</option>
                    }
                  </select>
                </div>

              </div>
            </div>
          </form>

          @if (form.invalid) {
            <div class="p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100">
              Corrija as medidas para gerar o layout. Mínimo 50mm, máximo 1200mm.
            </div>
          }
        </div>

        <!-- Painel Direito: Motor de Renderização SVG -->
        <div class="col-span-1 md:col-span-3 relative">
          
          <!-- Loader Overlay -->
          @if (isLoading) {
            <div class="absolute inset-0 bg-white/50 backdrop-blur-sm z-10 flex items-center justify-center rounded-xl transition-all">
              <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-slate-800"></div>
            </div>
          }

          <app-gaveta-svg 
            [layout]="layout" 
            [medidas]="medidasGaveta">
          </app-gaveta-svg>
          
        </div>

      </section>
    }
  </div>
</main>
<router-outlet></router-outlet>
